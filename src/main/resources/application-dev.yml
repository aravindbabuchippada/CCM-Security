server:
  port: 8081
  servlet:
    context-path: /security

app:
  jwtSecret: ScSw160jFqYm
  jwtExpirationMs: 3600000 # 1 Hour

spring:
  application:
    name: ccm-security
  datasource:
    hikari:
      pool-name: HikariPool
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 30000
      max-lifetime: 600000
    url: jdbc:postgresql://localhost:5432/ccmhelperdb
    username: ccmhelper
    password: ccmhelper
  redis:
    host: localhost
    port: 6379
    timeout: 60000

EUREKA_URL: http://localhost:8761/eureka

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
    reregister-interval-seconds: 15
  instance:
    hostname: localhost
    prefer-ip-address: false
    non-secure-port: ${server.port}
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${eureka.instance.non-secure-port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  server:
    shutdown: graceful

logging:
  level:
    root: INFO
    com.ccm.common: INFO
    com.ccm.security: DEBUG
    org.springframework.data.redis: INFO
    com.netflix.discovery: INFO
log:
  path: ../logs